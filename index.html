<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>AgentMesh</title>
  <link rel="stylesheet" href="node_modules/xterm/css/xterm.css" />
  <style>
    /* Single tint layer only — see CLAUDE.md, anything above ~0.5 alpha kills vibrancy. */
    html, body { margin: 0; height: 100%; background: #08090945; }

    :root {
      --chrome-bg: #1b1e24;
      /* one terminal cell, measured at runtime in renderer.js */
      --cell-w: 8px;
      --cell-h: 17px;
      /* traffic-light strip; renderer overwrites this from titlebar.js */
      --header-h: 36px;
    }

    /* Inter everywhere except the terminal itself, which stays monospace. */
    body {
      display: flex;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-feature-settings: "cv05" 1, "ss03" 1;
      color: #abb2bf;
      overflow: hidden;
    }

    /* Opaque on purpose: this kills vibrancy behind the sidebar (see CLAUDE.md
       gotcha #2) and leaves the glass to the terminal pane only. */
    #sidebar {
      width: 248px;
      flex: 0 0 248px;
      height: 100%;
      box-sizing: border-box;
      position: relative;
      background: var(--chrome-bg);
      border-right: 1px solid #ffffff12;
      display: flex;
      flex-direction: column;
      -webkit-app-region: drag;
    }

    #sidebar-resizer {
      -webkit-app-region: no-drag;
      position: absolute;
      top: 0;
      right: -3px;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      z-index: 10;
    }
    #sidebar-resizer:hover, #sidebar-resizer.dragging { background: #4aa5f04d; }

    body.resizing { cursor: col-resize; user-select: none; }
    body.resizing #terminal-pane { pointer-events: none; }

    #sidebar-header {
      height: var(--header-h);
      flex: 0 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 0 12px 6px 84px; /* left pad clears the traffic lights */
      font-size: 10px;
      letter-spacing: 0.08em;
      color: #5c6370;
    }
    #count { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #filter, #new-session {
      -webkit-app-region: no-drag;
      flex: 0 0 auto;
      cursor: pointer;
      color: #5c6370;
      user-select: none;
    }
    #filter:hover, #new-session:hover { color: #abb2bf; }
    #filter.on { color: #4aa5f0; }
    #new-session { font-size: 14px; line-height: 10px; }

    /* The header '+' always asks for a folder. This one is the common case: another
       agent on the thing you're already working on, no dialog in the way. */
    #new-agent {
      -webkit-app-region: no-drag;
      flex: 0 0 auto;
      margin: 2px 10px 6px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #abb2bf;
      background: #ffffff0a;
      border: 1px solid #ffffff14;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
    }
    #new-agent:hover { color: #d7dae0; background: #ffffff14; border-color: #4aa5f0; }
    #new-agent .plus { color: #4aa5f0; font-size: 13px; line-height: 11px; }
    #new-agent .where {
      margin-left: auto;
      color: #5c6370;
      font-size: 10px;
      max-width: 45%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #list {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 0 12px;
      -webkit-app-region: no-drag;
    }
    #list::-webkit-scrollbar { width: 6px; }
    #list::-webkit-scrollbar-thumb { background: #ffffff14; border-radius: 3px; }

    .group {
      font-size: 9px;
      letter-spacing: 0.1em;
      color: #4f5666;
      padding: 10px 12px 4px;
    }
    .group.collapsible {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .group.collapsible:hover { color: #abb2bf; }

    .chev {
      display: inline-block;
      font-size: 11px;
      line-height: 1;
      transition: transform 120ms ease;
    }
    .chev.open { transform: rotate(90deg); }

    .row {
      position: relative;
      padding: 6px 12px 7px 12px;
      cursor: pointer;
      border-left: 2px solid transparent;
    }
    .row:hover { background: #ffffff0d; }
    .row.live { border-left-color: #8cc26580; }
    .row.busy { border-left-color: #d18f52; }
    /* session already owns a tab in this window — click focuses it, never respawns */
    .row.open { background: #ffffff0a; border-left-color: #4aa5f0; }

    .row-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #d7dae0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row.dim .row-title { color: #abb2bf; }

    .dot {
      flex: 0 0 auto;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4f5666;
    }
    .dot.idle { background: #8cc265; }
    .dot.busy { background: #d18f52; }

    /* Closing is only meaningful for a session we're actually hosting, so the button
       exists only on open rows — everything else has no terminal to close. */
    .row-close {
      position: absolute;
      top: 5px;
      right: 8px;
      width: 15px;
      height: 15px;
      border-radius: 3px;
      text-align: center;
      line-height: 15px;
      font-size: 12px;
      color: #5c6370;
      opacity: 0;
    }
    .row:hover .row-close { opacity: 1; }
    .row-close:hover { background: #ffffff1f; color: #e05561; }

    .row-meta {
      font-size: 10px;
      color: #5c6370;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-meta .sep { color: #3f4451; padding: 0 4px; }

    /* Why a click didn't do what it looks like it should — lives on the row itself so
       the explanation is next to the thing it's about. */
    .row-hint {
      font-size: 10px;
      color: #d18f52;
      margin-top: 3px;
      white-space: normal;
    }

    .badge-ai { color: #c162de; }
    .badge-name { color: #4aa5f0; }

    /* Inline rename, used in both the sidebar row and the tab strip — it stands in
       for a label, so it has to sit on the same baseline and eat no extra height. */
    .rename-input {
      -webkit-app-region: no-drag;
      flex: 1 1 auto;
      min-width: 0;
      font-family: inherit;
      font-size: inherit;
      color: #d7dae0;
      background: #00000040;
      border: 1px solid #4aa5f0;
      border-radius: 3px;
      outline: none;
      padding: 0 4px;
      margin: -1px 0;
    }
    .rename-failed { color: #e05561; }

    #empty { padding: 16px 12px; font-size: 11px; color: #5c6370; }

    /* ---------------------------------------------------------- terminal pane */

    #terminal-pane {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    /* The terminal runs to the top of the window. Nothing needs reserving up there:
       the traffic lights sit over the sidebar, which is what `#sidebar-header` pads
       for, and the sidebar is drag region enough to move the window by. */
    #tabs-content {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
    }

    /* One cell of breathing room on every side, so the terminal reads as a framed
       block rather than text jammed against the window edge. Padding is set before
       term.open() runs (CLAUDE.md: xterm measures its box at open time), so both
       cell dimensions are computed from font metrics up front rather than from a
       live terminal. */
    .term-host {
      position: absolute;
      inset: 0;
      box-sizing: border-box;
      padding: var(--cell-h) var(--cell-w);
    }
    .term-host.hidden {
      visibility: hidden;
      pointer-events: none;
    }

    /* ------------------------------------------------------------- welcome pane */
    /* Shown whenever no session is open — on a cold launch, and again once the last
       terminal exits. Nothing is spawned until a directory is chosen, because a
       session's cwd decides which project it belongs to and can't be changed after. */

    #welcome {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    #welcome.hidden { display: none; }

    #welcome-title { font-size: 15px; color: #d7dae0; letter-spacing: 0.02em; }
    #welcome-sub { font-size: 11px; color: #5c6370; margin-top: -12px; }

    #pick-dir {
      -webkit-app-region: no-drag;
      font: inherit;
      font-size: 12px;
      color: #d7dae0;
      background: #ffffff0f;
      border: 1px solid #ffffff1f;
      border-radius: 6px;
      padding: 7px 14px;
      cursor: pointer;
    }
    #pick-dir:hover { background: #ffffff1a; border-color: #4aa5f0; }

    #recent-dirs {
      width: 100%;
      max-width: 420px;
      max-height: 40%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    #recent-dirs::-webkit-scrollbar { width: 6px; }
    #recent-dirs::-webkit-scrollbar-thumb { background: #ffffff14; border-radius: 3px; }

    .recent-label {
      font-size: 9px;
      letter-spacing: 0.1em;
      color: #4f5666;
      text-align: left;
      padding: 0 8px 4px;
    }

    .recent-dir {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
    }
    .recent-dir:hover { background: #ffffff0d; }
    .recent-dir .name { font-size: 12px; color: #d7dae0; }
    .recent-dir .path {
      font-size: 10px;
      color: #5c6370;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      <span id="count">SESSIONS</span>
      <span id="filter" title="Toggle: this project only / all projects">ALL</span>
      <span id="new-session" title="New session in another folder…">+</span>
    </div>
    <div id="new-agent" title="Start another Claude Code session">
      <span class="plus">+</span>
      <span>New session</span>
      <span class="where"></span>
    </div>
    <div id="list"></div>
    <div id="sidebar-resizer"></div>
  </div>
  <div id="terminal-pane">
    <div id="tabs-content">
      <div id="welcome">
        <div id="welcome-title">AgentMesh</div>
        <div id="welcome-sub">Pick a folder to start a Claude Code session in.</div>
        <button id="pick-dir">Open folder…</button>
        <div id="recent-dirs"></div>
      </div>
    </div>
  </div>
  <script src="node_modules/xterm/lib/xterm.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
