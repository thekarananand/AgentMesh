<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>AgentMesh</title>
  <link rel="stylesheet" href="node_modules/xterm/css/xterm.css" />
  <style>
    /* ------------------------------------------------------------------- fonts */

    /* Both families ship with the app (assets/fonts, regenerate with
       `npm run fonts`). They used to be Homebrew casks the user had to install by hand,
       which made a clone on any other machine silently wrong: not just uglier, but
       *mis-measured*, because renderer.js sizes the terminal cell against the monospace
       family and xterm lays out against that cell. Both are SIL OFL 1.1, which is what
       makes vendoring them legal — the license texts sit beside them and stay there.

       `font-display: block` on the terminal face is deliberate: a swap from a fallback
       would re-measure the grid under a running terminal. renderer.js waits for the face
       to load before it measures anything, so there is nothing to swap to. */
    @font-face {
      font-family: 'JetBrainsMono Nerd Font Mono';
      src: url('assets/fonts/JetBrainsMonoNerdFontMono-Regular.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: block;
    }
    @font-face {
      font-family: 'JetBrainsMono Nerd Font Mono';
      src: url('assets/fonts/JetBrainsMonoNerdFontMono-Bold.woff2') format('woff2');
      font-weight: 700; font-style: normal; font-display: block;
    }
    @font-face {
      font-family: 'JetBrainsMono Nerd Font Mono';
      src: url('assets/fonts/JetBrainsMonoNerdFontMono-Italic.woff2') format('woff2');
      font-weight: 400; font-style: italic; font-display: block;
    }
    @font-face {
      font-family: 'JetBrainsMono Nerd Font Mono';
      src: url('assets/fonts/JetBrainsMonoNerdFontMono-BoldItalic.woff2') format('woff2');
      font-weight: 700; font-style: italic; font-display: block;
    }

    /* Inter is variable, so two files cover every weight the chrome uses. */
    @font-face {
      font-family: 'Inter';
      src: url('assets/fonts/InterVariable.woff2') format('woff2-variations');
      font-weight: 100 900; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Inter';
      src: url('assets/fonts/InterVariable-Italic.woff2') format('woff2-variations');
      font-weight: 100 900; font-style: italic; font-display: swap;
    }

    /* Single tint layer only — see CLAUDE.md, anything above ~0.5 alpha kills vibrancy. */
    html, body { margin: 0; height: 100%; background: #08090945; }

    /* Without OS vibrancy behind it (anything that isn't macOS) that 27% alpha is a
       see-through window, not a subtler one — nothing is painting the backdrop. So the
       page paints its own, at the same colour the blur resolves to. Set from
       platformAPI.vibrancy in renderer.js before the first paint. */
    body.no-vibrancy, html:has(body.no-vibrancy) { background: #0f1116; }

    :root {
      --chrome-bg: #242428;

      /* Foreground ramp. Three steps, used consistently: default is content, muted is
         supporting, subtle is metadata. A fourth step would just be indecision. */
      --fg-default: #e6e6e6;
      --fg-muted: #c5c5c9;
      --fg-subtle: #8a8a91;
      --fg-faint: #5f5f67;

      /* Status colors are Primer's dark-theme functional tokens verbatim
         (@primer/primitives dist/css/functional/themes/dark.css) — GitHub Actions
         reads the same way, so the vocabulary transfers without a legend. */
      --status-success: #3fb950;
      --status-attention: #d29922;
      --status-muted: #9198a1;

      --accent: #4aa5f0;
      --danger: #e05561;

      --overlay-hover: #ffffff0f;
      --overlay-press: #ffffff1c;
      --border-subtle: #ffffff14;

      /* Keyboard focus is its own channel — it never reuses hover or the accent fills,
         or "focused" and "open" become the same picture. */
      --focus-ring: 0 0 0 2px #4aa5f0b3;

      --radius: 6px;

      /* One easing curve for everything non-gesture. Anything a finger can grab uses a
         spring in renderer.js instead — a fixed curve can't be interrupted mid-flight. */
      --ease: cubic-bezier(0.32, 0.72, 0, 1);

      /* Premium sidebar hover states — higher contrast, subtle feedback */
      --overlay-hover: rgba(255, 255, 255, 0.08);
      --overlay-press: rgba(255, 255, 255, 0.12);
      --border-subtle: rgba(255, 255, 255, 0.08);

      /* one terminal cell, measured at runtime in renderer.js */
      --cell-w: 8px;
      --cell-h: 17px;
      /* traffic-light strip; renderer overwrites this from titlebar.js */
      --header-h: 36px;
    }

    /* Inter everywhere except the terminal itself, which stays monospace. */
    body {
      display: flex;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-feature-settings: "cv05" 1, "ss03" 1;
      -webkit-font-smoothing: antialiased;
      color: var(--fg-muted);
      /* `clip`, not `hidden`: hidden still makes this a scroll container, one with no
         scrollbar, and Chromium will happily scroll it programmatically to chase a
         caret it thinks is off-screen (see the scroll clamp in renderer.js — macOS
         dictation into xterm's one-cell helper textarea does exactly that, and the
         whole window ends up displaced with no way to scroll back). `clip` means the
         element is not scrollable at all, so there is nothing to displace. */
      overflow: clip;
    }

    /* Every control in the chrome is a real <button>: focusable, Enter/Space-activated,
       announced as a control. They were divs and spans, which look identical and are
       reachable by exactly one input device. The reset comes first so each control's own
       rules below still win. */
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      appearance: none;
      -webkit-appearance: none;
      text-align: left;
    }
    /* Only ever on keyboard focus — a ring that appears on every click is noise. */
    button:focus-visible,
    .row:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    /* Opaque on purpose: this kills vibrancy behind the sidebar (see CLAUDE.md
       gotcha #2) and leaves the glass to the terminal pane only. Premium design
       with refined materials and improved spatial definition. */
    #sidebar {
      width: 248px;
      flex: 0 0 248px;
      height: 100%;
      box-sizing: border-box;
      position: relative;
      background: var(--chrome-bg);
      border-right: 1px solid #1a1a1f;
      display: flex;
      flex-direction: column;
      -webkit-app-region: drag;
    }

    #sidebar-resizer {
      -webkit-app-region: no-drag;
      position: absolute;
      top: 0;
      right: -3px;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      z-index: 10;
      touch-action: none; /* pointer capture owns the gesture, not the scroller */
    }
    #sidebar-resizer::after {
      content: '';
      position: absolute;
      inset: 0 2px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 140ms var(--ease);
    }
    #sidebar-resizer:hover::after { opacity: 0.35; }
    #sidebar-resizer.dragging::after { opacity: 0.7; }

    body.resizing { cursor: col-resize; user-select: none; }
    body.resizing #terminal-pane { pointer-events: none; }

    /* ------------------------------------------------------------ sidebar header */

    /* The traffic lights are centred on `HEADER_HEIGHT / 2` (main.js sets their origin to
       `H/2 - 6`, half a 12px button above the midline), so this strip has to centre its
       own content on exactly the same midline. Two things stopped it: no `box-sizing`,
       which made `height` the *content* box and the strip 40px tall rather than 36, and an
       asymmetric 4px top pad that pushed the centred row down again. Both together put the
       folder button 4px below the lights. Padding stays symmetric — anything that wants to
       move vertically moves against the midline, not by growing one edge. */
    #sidebar-header {
      height: var(--header-h);
      box-sizing: border-box;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px 0 84px; /* left pad clears the traffic lights */
    }

    /* Only macOS floats window buttons over the sidebar's top-left corner. Windows draws
       its overlay controls top-right, over the terminal pane, and Linux draws none at all —
       so off macOS that 84px is dead space in front of the folder name. */
    body.no-titlebar-inset #sidebar-header { padding-left: 10px; }

    /* In fullscreen, traffic lights disappear, so move folder selector left */
    body.fullscreen #sidebar-header { padding-left: 10px; }

    /* The header answers "where is this window pointed", and nothing else. It used to
       carry a session count (a number nobody acts on) and a '+' that opened a folder
       picker — which read as "new session" and behaved as "change folder", the worst
       possible pairing. Starting a session lives on one button, below, where it says so. */
    #dir {
      -webkit-app-region: no-drag;
      /* Hugs its label rather than filling the header — a hover highlight the width of the
         sidebar reads as a banner, not a button. Refined material design following Apple
         principles: translucent surface with spatial definition. */
      flex: 0 1 auto;
      min-width: 0;
      margin-right: auto;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 5px 5px 12px;
      border-left: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 0 5px 5px 0;
      cursor: pointer;
      user-select: none;
      color: var(--fg-muted);
      transition: all 180ms var(--ease);
    }
    #dir:hover {
      background: rgba(74, 165, 240, 0.15);
      color: var(--fg-default);
      border-left-color: rgba(74, 165, 240, 0.35);
      border-radius: 5px;
    }
    #dir:active {
      background: rgba(74, 165, 240, 0.22);
      border-left-color: rgba(74, 165, 240, 0.45);
      transform: scale(0.99);
    }
    /* Sits in #dir's spot when the panel below is showing recent folders instead of the
       session list — same header, same top-left corner, nothing moves. Hidden otherwise. */
    #dir-back {
      -webkit-app-region: no-drag;
      flex: 0 0 auto;
      display: none;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      margin-top: 2px;
      border-radius: 5px;
      cursor: pointer;
      color: var(--fg-muted);
      background: transparent;
      transition: background 140ms var(--ease), color 140ms var(--ease);
    }
    #dir-back.hidden { display: none; }
    #dir-back:hover { background: rgba(255, 255, 255, 0.08); color: var(--fg-default); }
    #dir-back:active { transform: scale(0.94); }
    #dir-back svg { width: 14px; height: 14px; fill: currentColor; }
    #sidebar.switching #dir-back { display: inline-flex; }
    #sidebar.switching #dir,
    #sidebar.switching #filter { display: none; }

    /* Folder-switch panel: replaces the whole list (sessions, new-session button,
       warnings, usage) with a pickable list of recent folders. Only one of this panel
       and the normal sidebar body is ever visible. */
    #dir-switch-panel {
      display: none;
      flex-direction: column;
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 8px 6px;
      gap: 1px;
      -webkit-app-region: no-drag;
    }
    #sidebar.switching #dir-switch-panel { display: flex; }
    #sidebar.switching #new-agent,
    #sidebar.switching #list,
    #sidebar.switching #warnings,
    #sidebar.switching #usage { display: none; }
    #dir-switch-browse { margin-bottom: 4px; border-bottom: 1px solid var(--border-subtle); border-radius: var(--radius) var(--radius) 0 0; padding-bottom: 9px; }

    #dir .dir-icon { display: inline-flex; flex: 0 0 auto; color: var(--fg-faint); }
    #dir .dir-icon svg { width: 18px; height: 18px; fill: currentColor; }
    #dir .dir-name {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: -0.005em;
    }
    /* No folder chosen yet — the control is an invitation, not a label. */
    #dir.unset .dir-name { color: var(--fg-faint); font-weight: 400; }
    #dir .dir-chev { display: inline-flex; flex: 0 0 auto; color: var(--fg-faint); }
    #dir .dir-chev svg { width: 11px; height: 11px; fill: currentColor; }

    /* Binary state, same accent-pill vocabulary the toggle has always had. The folder it
       scopes to is named right next to it, so the glyph doesn't have to repeat it. */
    #filter {
      -webkit-app-region: no-drag;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 20px;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
      color: var(--fg-faint);
      background: transparent;
      transition: background 140ms var(--ease), color 140ms var(--ease), transform 110ms var(--ease);
    }
    #filter svg { width: 14px; height: 14px; fill: currentColor; }
    #filter:hover { background: rgba(255, 255, 255, 0.08); color: var(--fg-default); }
    #filter:active { transform: scale(0.94); }
    #filter.on { background: rgba(74, 165, 240, 0.15); color: var(--accent); }
    /* Armed but with no folder to scope to: the list is showing everything, so the toggle
       says so by dimming rather than lighting up. */
    #filter.empty { opacity: 0.4; }

    /* One button, one meaning: start a session in the folder the header names.
       Premium styling with refined feedback and spatial consistency. */
    #new-agent {
      -webkit-app-region: no-drag;
      flex: 0 0 auto;
      margin: 4px 10px 8px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: var(--fg-default);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius);
      cursor: pointer;
      user-select: none;
      transition: all 140ms var(--ease);
    }
    #new-agent:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.15);
    }
    #new-agent:active {
      background: rgba(255, 255, 255, 0.16);
      transform: scale(0.98);
    }
    #new-agent .plus { display: inline-flex; color: var(--accent); }
    #new-agent .plus svg { width: 13px; height: 13px; fill: currentColor; }

    /* ---------------------------------------------------------------- session list */

    #list {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 0 12px;
      -webkit-app-region: no-drag;
      /* A row on its way out is taken out of flow and positioned against this box, so
         the rows behind it close the gap immediately instead of waiting for the fade. */
      position: relative;
    }
    #list::-webkit-scrollbar { width: 6px; }
    #list::-webkit-scrollbar-thumb { background: #ffffff14; border-radius: 3px; }
    #list::-webkit-scrollbar-thumb:hover { background: #ffffff26; }

    /* Scroll edge effect instead of a 1px rule under the header: content dissolves
       where it passes beneath the chrome, and only once there's something under it. */
    #list.scrolled {
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 18px);
      mask-image: linear-gradient(to bottom, transparent 0, #000 18px);
    }

    .group {
      display: flex;
      align-items: center;
      gap: 5px;
      margin: 12px 12px 3px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.11em;
      color: var(--fg-faint);
      user-select: none;
    }
    .group .count {
      margin-left: auto;
      font-weight: 500;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }
    /* The one group that wants something from you. Color only — no size or weight
       change, or it stops being a group header and starts being an alert. */
    .group.urgent { color: var(--status-attention); }
    .group.collapsible { cursor: pointer; }
    .group.collapsible:hover { color: var(--fg-muted); }

    .chev {
      display: inline-flex;
      margin-left: -3px;
      transition: transform 200ms var(--ease);
    }
    .chev svg { width: 11px; height: 11px; fill: currentColor; }
    .chev.open { transform: rotate(90deg); }

    /* A row is a run: status glyph in its own gutter, title on the first line, the
       where-and-what underneath, aligned to the title rather than to the glyph. */
    .row {
      position: relative;
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr);
      column-gap: 9px;
      align-items: start;
      /* A fork indents under its origin; --depth is set per row in renderer.js. */
      margin: 1px 6px 1px calc(6px + var(--depth, 0) * 15px);
      padding: 6px 10px 7px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 140ms var(--ease), transform 110ms var(--ease);
    }
    .row:hover { background: rgba(255, 255, 255, 0.06); }
    /* Feedback on press, not on release — waiting for the click to land feels dead. */
    .row:active { background: rgba(255, 255, 255, 0.1); transform: scale(0.98); }

    /* Two different facts, and they used to render as one. `.open` is "this window hosts
       a terminal for it" — true of every tab at once, so it gets a fill and nothing more.
       The accent bar means "and this is the one on screen", which is true of exactly one
       row, so the bar is the answer to "where am I" and never appears twice. */
    .row.open { background: rgba(74, 165, 240, 0.1); }
    .row.open:hover { background: rgba(74, 165, 240, 0.15); }

    .row.active-tab { background: rgba(74, 165, 240, 0.2); }
    .row.active-tab:hover { background: rgba(74, 165, 240, 0.25); }
    .row.active-tab .row-title { color: #f0f5ff; }
    .row.active-tab::before,
    .row.pending::before {
      content: '';
      position: absolute;
      left: -3px;
      top: 8px;
      bottom: 8px;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: var(--accent);
    }

    /* Opening a session waits 220ms to rule out a double-click, then spawns a pty — up to
       half a second where a click had no visible result. The row takes the accent bar
       early and pulses it: the outcome is already being drawn before it arrives. */
    .row.pending { background: #4aa5f01f; }
    .row.pending::before { animation: pending-pulse 900ms ease-in-out infinite; }
    @keyframes pending-pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Rows arrive with motion and used to blink out of existence, which reads as a
       glitch rather than a departure. Leaving is the entrance reversed, and the node is
       absolutely positioned first so the list closes the gap on the same frame the fade
       starts. */
    @keyframes row-out {
      to { opacity: 0; transform: scale(0.97) translateY(-4px); }
    }
    .row.leaving {
      margin: 0;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 1;
      animation: row-out 200ms var(--ease) both;
    }

    /* The indent alone reads as arbitrary whitespace at this size, so a hairline runs
       up the child's left edge to point back at what it branched from. */
    .row.child::after {
      content: '';
      position: absolute;
      left: -8px;
      top: -1px;
      bottom: 50%;
      width: 7px;
      border-left: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      border-bottom-left-radius: 5px;
      pointer-events: none;
    }

    /* New sessions arrive rather than blinking into existence. Rows are reused across
       repaints (renderer.js keys them by sessionId), so this plays exactly once. */
    @keyframes row-in {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: none; }
    }
    .row.entering { animation: row-in 260ms var(--ease) both; }

    .row-title {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--fg-default);
    }
    .row-label {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row.dim .row-title { color: var(--fg-muted); font-weight: 400; }
    /* Keep the title clear of whatever button the row's state puts in the corner. */
    .row.open .row-title, .row.elsewhere .row-title { padding-right: 20px; }

    /* State the row is in, said in a word rather than in a message that appears after
       a click fails to do what it looked like it would. */
    .chip {
      flex: 0 0 auto;
      padding: 1px 5px;
      border-radius: 3px;
      /* Uppercase at 8.5px sat under the legibility floor — small text wants a bump in
         size and tracking, not the other way round. */
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.5;
    }
    .chip[hidden] { display: none; }
    .chip.inuse { color: var(--status-attention); background: #d2992224; }
    .chip.fork { color: var(--accent); background: #4aa5f01f; }

    /* Status glyph follows GitHub Actions: an amber spinner while the run is in
       flight, amber dot when it's blocked on you, a green dot the moment it lands,
       a muted dot for anything archived. */
    .status {
      grid-column: 1;
      grid-row: 1;
      display: inline-flex;
      width: 16px;
      height: 16px;
      color: var(--status-muted);
    }
    .status svg { display: block; width: 16px; height: 16px; }
    .status.idle { color: var(--status-success); }
    .status.busy, .status.waiting { color: var(--status-attention); }

    /* Primer's Spinner is 1s linear infinite. Each instance also gets a negative
       animation-delay in JS so rows that mount at different times still rotate in
       phase — GitHub does the same (computeSyncDelay in Spinner.tsx). */
    @keyframes rotate-keyframes { to { transform: rotate(360deg); } }
    .status.busy svg {
      transform-origin: 50% 50%;
      animation: rotate-keyframes 1s linear infinite;
    }

    /* "It came back" cue: one ring pulse on the first busy -> not-busy flip, so a
       glance catches the handoff without having watched the spinner stop. The dot also
       overshoots slightly on arrival — the motion points at the state it's landing in
       rather than just interpolating to it. */
    @keyframes status-land {
      from { box-shadow: 0 0 0 0 currentColor; }
      to   { box-shadow: 0 0 0 9px transparent; }
    }
    @keyframes status-land-pop {
      0%   { transform: scale(0.4); }
      55%  { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    .status.landed {
      border-radius: 50%;
      animation: status-land 800ms var(--ease) 1;
    }
    .status.landed svg { animation: status-land-pop 420ms var(--ease) 1; }

    /* Closing is only meaningful for a terminal we're actually hosting, so the button
       exists only on open rows. Every hosted tab has a card now — including FleetView
       and sessions too young to have registered — so "hosted" and "closable" finally
       mean the same set. */
    .row-close, .row-fork {
      position: absolute;
      top: 6px;
      right: 6px;
      display: none;
      align-items: center;
      justify-content: center;
      width: 17px;
      height: 17px;
      border-radius: 4px;
      color: var(--fg-faint);
      opacity: 0;
      transition: opacity 120ms var(--ease), background 120ms var(--ease), color 120ms var(--ease);
    }
    .row-close svg, .row-fork svg { width: 11px; height: 11px; fill: currentColor; }
    .row.open .row-close { display: inline-flex; }
    .row.open:hover .row-close { opacity: 1; }
    .row-close:hover { background: #ffffff1f; color: var(--danger); }

    /* The fork button replaces a hidden ⌥click. It's the only action a session owned by
       another process can take, so it's on the card, not in a modifier key. */
    .row.elsewhere .row-fork { display: inline-flex; opacity: 0.55; }
    .row.elsewhere:hover .row-fork { opacity: 1; }
    .row-fork:hover { background: #ffffff1f; color: var(--accent); }

    .row-meta {
      grid-column: 2;
      grid-row: 2;
      font-size: 10px;
      line-height: 1.4;
      letter-spacing: 0.01em;
      color: var(--fg-subtle);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row.dim .row-meta { color: var(--fg-faint); }
    .row-meta .sep { color: #3f4451; padding: 0 4px; }

    .badge-ai { color: #c162de; }
    .badge-name { color: var(--accent); }

    /* Inline rename, used in both the sidebar row and the tab strip — it stands in
       for a label, so it has to sit on the same baseline and eat no extra height. */
    .rename-input {
      -webkit-app-region: no-drag;
      flex: 1 1 auto;
      min-width: 0;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      color: var(--fg-default);
      background: #00000040;
      border: 1px solid var(--accent);
      border-radius: 4px;
      outline: none;
      padding: 0 4px;
      margin: -1px 0;
    }
    .rename-failed { color: var(--danger); }

    #empty { padding: 16px 12px 4px; font-size: 11px; color: var(--fg-subtle); }

    /* A scoped window hides sessions and used to say nothing about it — the list read as
       "this is everything" when it was "this is a slice". This is both the count and the
       way out of it, which is also what makes an empty scoped list not a dead end. */
    .list-more {
      display: block;
      width: calc(100% - 12px);
      margin: 6px 6px 0;
      padding: 6px 10px;
      border-radius: var(--radius);
      font-size: 10.5px;
      color: var(--fg-subtle);
      cursor: pointer;
      transition: background 140ms var(--ease), color 140ms var(--ease);
    }
    .list-more:hover { background: var(--overlay-hover); color: var(--fg-muted); }
    .list-more:active { background: var(--overlay-press); }

    /* ---------------------------------------------------------- terminal pane */

    #terminal-pane {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    /* The terminal runs to the top of the window. Nothing needs reserving up there:
       the traffic lights sit over the sidebar, which is what `#sidebar-header` pads
       for, and the sidebar is drag region enough to move the window by. */
    #tabs-content {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      overflow: clip; /* same reason as body — never a scroll container */
    }

    /* One cell of breathing room on every side, so the terminal reads as a framed
       block rather than text jammed against the window edge. Padding is set before
       term.open() runs (CLAUDE.md: xterm measures its box at open time), so both
       cell dimensions are computed from font metrics up front rather than from a
       live terminal. */
    .term-host {
      position: absolute;
      inset: 0;
      box-sizing: border-box;
      padding: var(--cell-h) var(--cell-w);
      overflow: clip;
    }
    .term-host.hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .term-host.drag-over {
      background: #4aa5f015;
      border: 1px solid var(--accent);
      border-radius: 4px;
    }

    /* ------------------------------------------------------------- welcome pane */
    /* Shown whenever no session is open — on a cold launch, and again once the last
       terminal exits. Nothing is spawned until a directory is chosen, because a
       session's cwd decides which project it belongs to and can't be changed after. */

    #welcome {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      animation: welcome-in 340ms var(--ease) both;
    }
    #welcome.hidden { display: none; }

    /* Materializes rather than fades — scale and opacity together, so the pane reads
       as arriving from the same depth the terminal just left. */
    @keyframes welcome-in {
      from { opacity: 0; transform: scale(0.985) translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    /* Large text wants negative tracking and tight leading; the 11px caption under it
       wants neither. Hierarchy comes from weight + size + leading as a set. */
    #welcome-logo {
      width: 64px;
      height: 64px;
      opacity: 0.92;
    }
    #welcome-title {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: #e6e6e6;
    }
    #welcome-sub {
      font-size: 12px;
      line-height: 1.45;
      color: var(--fg-subtle);
      margin-top: -12px;
      max-width: 42ch;
      text-wrap: balance;
    }
    /* Missing CLI is the one thing this line ever has to *warn* about, and it is the same
       amber the sidebar's warning strip and a WAITING row use. */
    #welcome-sub.warn { color: var(--status-attention); }

    /* Nothing to start without a binary — a disabled control that still looks clickable is
       worse than one that reads as unavailable. */
    #pick-dir:disabled, #new-agent:disabled {
      opacity: 0.4;
      cursor: default;
      pointer-events: none;
    }

    #pick-dir {
      -webkit-app-region: no-drag;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--fg-default);
      background: #ffffff0f;
      border: 1px solid #ffffff1f;
      border-radius: var(--radius);
      padding: 7px 14px;
      cursor: pointer;
      transition: background 140ms var(--ease), border-color 140ms var(--ease), transform 110ms var(--ease);
    }
    #pick-dir:hover { background: #ffffff1a; border-color: #ffffff33; }
    #pick-dir:active { background: var(--overlay-press); transform: scale(0.97); }

    .recent-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.11em;
      color: var(--fg-faint);
      text-align: left;
      padding: 0 8px 4px;
    }

    .recent-dir {
      width: 100%;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      border-radius: var(--radius);
      cursor: pointer;
      text-align: left;
      transition: background 140ms var(--ease), transform 110ms var(--ease);
    }
    .recent-dir:hover { background: var(--overlay-hover); }
    .recent-dir:active { background: var(--overlay-press); transform: scale(0.99); }
    .recent-dir .icon { display: inline-flex; flex: 0 0 auto; color: var(--fg-faint); }
    .recent-dir .icon svg { width: 18px; height: 18px; fill: currentColor; }
    .recent-dir .name { font-size: 12px; font-weight: 500; color: var(--fg-default); flex: 0 0 auto; }
    /* Full path is clutter until you actually need it — the name alone is enough to
       recognize a folder you've already worked in. Reveal on hover, same box either
       way so nothing shifts. */
    .recent-dir .path {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 10px;
      color: var(--fg-subtle);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 120ms var(--ease);
    }
    .recent-dir:hover .path { opacity: 1; }

    /* ----------------------------------------------------------------- warnings */

    /* Same `:empty`-is-hidden contract as the usage footer, and directly above it, because
       both answer about the app rather than any one row. Amber, not red: nothing here is
       broken, something is unavailable — the same vocabulary as a WAITING row. */
    #warnings {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-top: 1px solid var(--border-subtle);
      font-size: 11px;
      line-height: 1.45;
      color: var(--status-attention);
      -webkit-app-region: no-drag;
      user-select: text;
    }
    #warnings:empty { display: none; }

    /* ---------------------------------------------------------------- plan usage */

    /* One account-wide fact, so it sits outside the scrolling list rather than in it.
       `:empty` is the hidden state — an API-key or Bedrock session has no plan windows
       to report and gets the sidebar it has always had, not an empty frame. */
    #usage {
      flex: 0 0 auto;
      -webkit-app-region: no-drag; /* the sidebar is a drag region; a click target must opt out */
      padding: 9px 12px 10px;
      border-top: 1px solid var(--border-subtle);
      cursor: pointer;
      user-select: none;
      transition: background 140ms var(--ease), opacity 140ms var(--ease);
    }
    #usage:empty { display: none; }
    #usage:hover { background: var(--overlay-hover); }
    #usage:active { background: var(--overlay-press); }
    #usage.pending { opacity: 0.5; }
    /* Last known numbers, not current ones — dim rather than disappear. */
    #usage.stale .usage-track i { opacity: 0.4; }
    #usage.stale .usage-pct, #usage.stale .usage-foot { color: var(--fg-faint); }

    .usage-row {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 15px;
      font-size: 10px;
      color: var(--fg-subtle);
    }
    .usage-label { flex: 0 0 40px; letter-spacing: 0.04em; }
    .usage-track {
      flex: 1 1 auto;
      height: 3px;
      border-radius: 2px;
      background: var(--border-subtle);
      overflow: hidden;
    }
    .usage-track i {
      display: block;
      height: 100%;
      border-radius: 2px;
      background: var(--status-success);
      transition: width 320ms var(--ease), background 200ms var(--ease);
    }
    .usage-pct {
      flex: 0 0 27px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    /* Same three-state vocabulary as the row status glyphs: green is fine, amber wants
       attention, red is the one you're about to run into. */
    .usage-row.warn .usage-track i { background: var(--status-attention); }
    .usage-row.warn .usage-pct { color: var(--status-attention); }
    .usage-row.crit .usage-track i { background: var(--danger); }
    .usage-row.crit .usage-pct { color: var(--danger); }

    .usage-foot {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 5px;
      font-size: 9px;
      color: var(--fg-faint);
    }
    .usage-reset {
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .usage-foot.urgent .usage-reset { color: var(--status-attention); }
    .usage-plan {
      flex: 0 0 auto;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      font-weight: 600;
    }

    /* ------------------------------------------------------------- accessibility */
    /* Reduced motion is not "no feedback" — the press states, hovers and color
       changes all stay, only the vestibular parts go. */
    @media (prefers-reduced-motion: reduce) {
      .status.busy svg,
      .status.landed,
      .status.landed svg,
      .row.entering,
      .row.leaving,
      #welcome { animation: none; }
      /* The pending bar still has to read as pending — it holds still at a value
         between "off" and "on" rather than oscillating between them. */
      .row.pending::before { animation: none; opacity: 0.65; }
      .row:active, #new-agent:active, #pick-dir:active,
      .recent-dir:active, #filter:active { transform: none; }
      .chev { transition: none; }
      .usage-track i { transition: none; }
    }

    /* Vibrancy is a window-level effect, so the most this can do is stop the content
       layer from relying on what shows through it. */
    @media (prefers-reduced-transparency: reduce) {
      html, body { background: #0f1116; }
    }

    @media (prefers-contrast: more) {
      :root {
        --fg-default: #ffffff;
        --fg-muted: #d7dae0;
        --fg-subtle: #a6adbb;
        --fg-faint: #8b93a3;
        --border-subtle: #ffffff3d;
        --overlay-hover: #ffffff1f;
      }
      #sidebar { border-right-color: #ffffff4d; }
      .row.open { outline: 1px solid #4aa5f080; outline-offset: -1px; }
      .row.active-tab { outline: 1px solid var(--accent); outline-offset: -1px; }
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      <button id="dir-back" class="hidden" type="button" title="Close">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
      </button>
      <button id="dir" class="unset" type="button" title="Change this window's folder">
        <!-- JetBrains Icons (dark), folder.svg — see assets/icons/jetbrains-icons -->
        <span class="dir-icon">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8.10584 4.34613L8.25344 4.5H8.46667H13C13.8284 4.5 14.5 5.17157 14.5 6V12.1333C14.5 12.9529 13.932 13.5 13.3667 13.5H2.63333C2.06804 13.5 1.5 12.9529 1.5 12.1333V3.86667C1.5 3.04707 2.06804 2.5 2.63333 2.5H6.1217C6.25792 2.5 6.38824 2.55557 6.48253 2.65387L8.10584 4.34613Z" fill="#43454A" stroke="#CED0D6"/></svg>
        </span>
        <span class="dir-name">Choose folder</span>
        <!-- JetBrains Icons (dark), chevron_down.svg — see assets/icons/jetbrains-icons -->
        <span class="dir-chev">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11.5 6.25L8 9.75L4.5 6.25" stroke="#B4B8BF" stroke-linecap="round"/></svg>
        </span>
      </button>
      <button id="filter" type="button" aria-pressed="false" title="Toggle: this folder only / every session on this machine">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M.75 3h14.5a.75.75 0 0 1 0 1.5H.75a.75.75 0 0 1 0-1.5ZM3 7.75A.75.75 0 0 1 3.75 7h8.5a.75.75 0 0 1 0 1.5h-8.5A.75.75 0 0 1 3 7.75Zm3 4a.75.75 0 0 1 .75-.75h2.5a.75.75 0 0 1 0 1.5h-2.5a.75.75 0 0 1-.75-.75Z"/></svg>
      </button>
    </div>
    <div id="dir-switch-panel">
      <button id="dir-switch-browse" class="recent-dir" type="button">
        <!-- JetBrains Icons (dark), folder.svg — see assets/icons/jetbrains-icons -->
        <span class="icon">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8.10584 4.34613L8.25344 4.5H8.46667H13C13.8284 4.5 14.5 5.17157 14.5 6V12.1333C14.5 12.9529 13.932 13.5 13.3667 13.5H2.63333C2.06804 13.5 1.5 12.9529 1.5 12.1333V3.86667C1.5 3.04707 2.06804 2.5 2.63333 2.5H6.1217C6.25792 2.5 6.38824 2.55557 6.48253 2.65387L8.10584 4.34613Z" fill="#43454A" stroke="#CED0D6"/></svg>
        </span>
        <span class="name">Browse…</span>
      </button>
      <div id="dir-switch-list"></div>
    </div>
    <button id="new-agent" type="button" title="Start another Claude Code session">
      <span class="plus">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"/></svg>
      </span>
      <span>New session</span>
    </button>
    <div id="list" role="listbox" aria-label="Claude Code sessions"></div>
    <!-- Degradations that would otherwise be invisible: a feature that stopped working
         with no symptom is worse than one that says so. Empty and hidden by default. -->
    <div id="warnings" role="status"></div>
    <div id="usage" title="Claude plan usage · click to refresh"></div>
    <div id="sidebar-resizer"></div>
  </div>
  <div id="terminal-pane">
    <div id="tabs-content">
      <div id="welcome">
        <img id="welcome-logo" src="assets/logo-white.svg" alt="" />
        <div id="welcome-title">AgentMesh</div>
        <div id="welcome-sub">Pick a folder to start a Claude Code session in.</div>
        <button id="pick-dir">Open folder…</button>
      </div>
    </div>
  </div>
  <script src="node_modules/xterm/lib/xterm.js"></script>
  <script src="node_modules/xterm-addon-canvas/lib/xterm-addon-canvas.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
